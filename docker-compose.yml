version: '3.8'

services:
  main-site:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service
  main-site-dev:
    build:
      context: .
      target: builder
    ports:
      - '5173:5173'
      - '24678:24678' # Vite HMR port
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

networks:
  default:
    name: kenflynn-portfolio
