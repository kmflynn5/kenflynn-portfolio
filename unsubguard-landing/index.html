<!DOCTYPE html>
<html>
<head>
    <title>UnsubGuard - Email Fatigue Prevention</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            margin: 1rem;
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .email-form {
            margin-top: 2rem;
        }
        input {
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        .tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UnsubGuard</h1>
        <p><strong>Stop losing subscribers to email fatigue</strong></p>
        <p>We prevent 40% of unsubscribes by detecting and preventing email fatigue before it happens.</p>
        
        <div class="email-form">
            <input type="email" placeholder="Enter your email for early access">
            <button>Get Early Access</button>
        </div>
        
        <div class="tag">Launching January 2025</div>
        
        <p style="margin-top: 2rem; font-size: 14px; color: #999;">
            For e-commerce and SaaS companies using HubSpot, Klaviyo, or SendGrid
        </p>
    </div>
</body>
</html>
